<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>葛西家族教会 受付</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7f6; color: #173b2d; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    main { max-width: 560px; min-height: 100vh; margin: auto; padding: 40px 20px; display: grid; align-content: center; }
    section { background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 4px 18px rgb(0 0 0 / 8%); text-align: center; }
    h1 { margin: 0 0 20px; font-size: 24px; }
    p { margin: 0; line-height: 1.8; }
    .note { margin-top: 18px; color: #52645c; font-size: 14px; }
    .error { color: #b3261e; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>葛西家族教会 受付</h1>
      <p id="message">受付システムを準備しています。</p>
      <p id="detail" class="note">この画面は公開確認用です。</p>
    </section>
  </main>
  <script>
    const LIFF_ID = "2011459385-7IJkDlr6";
    const message = document.getElementById("message");
    const detail = document.getElementById("detail");

    async function start() {
      try {
        await liff.init({ liffId: LIFF_ID });
        message.textContent = "受付システムの公開準備ができました。";
        detail.textContent = "次の設定が完了すると、ここに初回登録と出席ボタンを表示します。";
      } catch (error) {
        message.textContent = "受付画面を開始できませんでした。";
        detail.textContent = "設定中の場合は、このまま次の手順へ進んでください。";
        detail.classList.add("error");
      }
    }

    start();
  </script>
</body>
</html>
